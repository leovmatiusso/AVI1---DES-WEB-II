<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Exercício 3</title>
    <link rel="stylesheet" href="../estilo/estilo.css">
    <script src="../script/script.js" defer></script>
</head>

<body>
    <nav class="navbar">
        <ul class="nav-links">
            <li><a href="../index.html">Exercício 1</a></li>
            <li><a href="ex2.html">Exercício 2</a></li>
            <li><a href="ex3.html" class="active">Exercício 3</a></li>
            <li><a href="ex4.html">Exercício 4</a></li>
            <li><a href="ex5.html">Exercício 5</a></li>
            <li><a href="ex6.html">Exercício 6</a></li>
        </ul>
    </nav>

    <main class="content-wrapper">
        <div class="container">
            <h2>Exercício 3 – Controle de Produção com Estoque</h2>
            <div class="card">
                <h3>Nova ordem de produção</h3>

                <label for="codigo">Código da ordem</label>
                <input type="number" id="codigo" placeholder="Ex: 1001">

                <label for="codProduto">Código do produto</label>
                <input type="text" id="codProduto" placeholder="Ex: P-500">

                <label for="tipo">Tipo de produto</label>
                <input type="number" id="tipo" placeholder="Digite o número correspondente">
                <div class="regioes">1 - Padrão | 2 - Premium (+10%) | 3 - Sob encomenda (+20%)</div>

                <label for="qt">Quantidade produzida</label>
                <input type="number" id="qt" placeholder="Ex: 300">

                <label for="custoBase">Custo unitário base (R$)</label>
                <input type="number" id="custoBase" placeholder="Ex: 12.50">

                <label for="estoqueInicial">Estoque inicial do produto</label>
                <input type="number" id="estoqueInicial" placeholder="Ex: 4500">

                <div class="botoes">
                    <button id="btnAdicionar" onclick="calcularResEx3()">Adicionar Ordem</button>
                    <button id="btnRelatorio" onclick="gerarRelatorioEx3()">Ver Relatório</button>
                </div>
            </div>

            <div class="card">
                <h3>Ordens cadastradas</h3>
                <ul id="listaPedidos"></ul>
            </div>

            <div class="card" id="textoResultado">
                <h3>Relatório</h3>
                <p>O relatório aparecerá aqui.</p>
            </div>
        </div>
    </main>
</body>

</html>
