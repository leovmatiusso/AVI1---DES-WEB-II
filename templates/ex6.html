<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Exercício 6</title>

</head>

<body>
    <nav class="navbar">
        <ul class="nav-links">
            <li><a href="../index.html">Exercício 1</a></li>
            <li><a href="ex2.html">Exercício 2</a></li>

            <li><a href="ex6.html" class="active">Exercício 6</a></li>
        </ul>
    </nav>

    <main class="content-wrapper">
        <div class="container">
            <h2>Exercício 6 – Vendas com Comissões, Metas e Performance</h2>
            <div class="card">
                <h3>Nova venda</h3>

                <label for="codigo">Código da venda</label>
                <input type="number" id="codigo" placeholder="Ex: 1001">

                <label for="codVendedor">Código do vendedor</label>
                <input type="text" id="codVendedor" placeholder="Ex: V-01">

                <label for="regiao">Região da loja</label>
                <input type="number" id="regiao" placeholder="Digite o número correspondente">
                <div class="regioes">1 - Norte | 2 - Nordeste | 3 - Sudeste | 4 - Sul</div>

                <label for="valorVenda">Valor da venda (R$)</label>
                <input type="number" id="valorVenda" placeholder="Ex: 850.00">

                <label for="tipoCliente">Tipo de cliente</label>
                <input type="text" id="tipoCliente" placeholder="PF ou PJ">

                <label for="percBase">Percentual base de comissão (%)</label>
                <input type="number" id="percBase" placeholder="Ex: 5">

                <label for="meta">Meta mensal de vendas por vendedor (R$)</label>
                <input type="number" id="meta" placeholder="Ex: 10000">

                <div class="botoes">
                    <button id="btnAdicionar" onclick="calcularResEx6()">Adicionar Venda</button>
                    <button id="btnRelatorio" onclick="gerarRelatorioEx6()">Ver Relatório</button>
                </div>
            </div>

            <div class="card">
                <h3>Vendas cadastradas</h3>
                <ul id="listaPedidos"></ul>
            </div>

            <div class="card" id="textoResultado">
                <h3>Relatório</h3>
                <p>O relatório aparecerá aqui.</p>
            </div>
        </div>
    </main>
</body>

</html>
